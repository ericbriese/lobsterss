<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lobsterss</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #eeece9;
      color: #3a3a3a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.65;
    }
    .container { max-width: 740px; margin: 64px auto; padding: 0 24px 80px; }
    h1 { font-size: 1.9rem; font-weight: 700; color: #222; margin-bottom: 6px; }
    h2 {
      font-size: 0.75rem; font-weight: 600; color: #888;
      text-transform: uppercase; letter-spacing: 0.1em;
      margin: 48px 0 14px; padding-bottom: 8px;
      border-bottom: 1px solid #d8d5d0;
    }
    p { margin-bottom: 16px; color: #4a4a4a; }
    a { color: #6b6b6b; text-underline-offset: 3px; }
    a:hover { color: #222; }
    code {
      font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
      font-size: 0.85em;
      background: #e2dfdb;
      padding: 2px 5px;
      border-radius: 3px;
      color: #333;
    }
    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 0.9rem; }
    th {
      text-align: left; padding: 9px 14px;
      background: #e2dfdb; color: #555; font-weight: 600;
      border-bottom: 1px solid #ccc;
    }
    td { padding: 9px 14px; border-bottom: 1px solid #dedad6; color: #4a4a4a; }
    tr:last-child td { border-bottom: none; }
    ul { margin: 0 0 16px 20px; }
    li { margin-bottom: 6px; color: #4a4a4a; }
    .toc { background: #e8e5e1; border-radius: 4px; padding: 16px 20px; margin-bottom: 40px; }
    .toc ul { margin: 0; list-style: none; }
    .toc li { margin-bottom: 4px; }
    .toc a { font-size: 0.9rem; }
    footer {
      margin-top: 64px; padding-top: 20px;
      border-top: 1px solid #d8d5d0;
      font-size: 0.85rem; color: #999;
    }
    footer a { color: #999; }
    footer a:hover { color: #555; }
  </style>
</head>
<body>
  <div class="container">
    <!-- CONTENT -->
    <footer>
      <a href="https://github.com/ericbriese/lobsterss">github.com/ericbriese/lobsterss</a>
    </footer>
  </div>
</body>
</html>
